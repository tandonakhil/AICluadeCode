<!-- @dsCard group="Screens" name="Add-memory sheet — photo upload" subtitle="Full screen with sheet overlay, privacy cue at point of upload; revision-2 vivid palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>little-milestones — Add memory / photo upload (full screen)</title>
<style>
  :root{
    --lm-cream:#FDF8F2; --lm-card:#FFFFFF; --lm-ink:#3D3833; --lm-ink-soft:#6E6259;
    --lm-terracotta:#C1502A; --lm-terracotta-deep:#8F3A1D; --lm-sage:#2F7A4E;
    --lm-slate:#3D6188; --lm-slate-tint:#EEF3F8; --lm-gold:#E8A317;
    --lm-blush:#FADCC5; --lm-coral:#FF7A50; --lm-sky:#6FA8D8; --lm-moss:#7CB56C;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",sans-serif;background:#EFE7DA;color:var(--lm-ink);margin:0;padding:36px 16px;line-height:1.55}
  .caption{text-align:center;font-size:13px;color:var(--lm-ink-soft);margin:0 0 10px;font-weight:600}
  .device{width:375px;margin:0 auto}
  .screen{background:#3D3833;border-radius:32px;overflow:hidden;box-shadow:0 20px 46px rgba(61,56,51,.22);min-height:820px;display:flex;flex-direction:column;position:relative}
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  .bg-hint{padding:60px 24px;color:rgba(255,255,255,.55);font-size:13px;text-align:center}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--lm-cream);border-radius:26px 26px 0 0;padding:16px 20px 22px;max-height:88%;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .grabber{width:40px;height:5px;border-radius:999px;background:#E3D6C6;margin:0 auto 14px}
  .sheet h1{font-size:18px;margin:0 0 16px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--lm-ink-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em}
  .photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ptile{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
  .ptile.add{background:#fff;border:2px dashed #E3D6C6;color:var(--lm-terracotta);font-size:26px}
  .ptile.p1{background:linear-gradient(135deg,var(--lm-coral),var(--lm-gold))}
  .ptile.p2{background:linear-gradient(135deg,var(--lm-sky),var(--lm-slate))}
  .ptile.p3{background:linear-gradient(135deg,var(--lm-moss),var(--lm-sage))}
  .privacy{font-size:13px;color:var(--lm-ink-soft);background:#fff;border-radius:12px;padding:10px 14px;margin-top:10px;display:flex;gap:8px}
  input[type=text]{width:100%;font:inherit;font-size:15px;border:1.5px solid #EADFD3;border-radius:14px;padding:12px 14px;background:#fff}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;border:1.5px solid transparent;cursor:pointer}
  .tag.first{background:#FFF3EC;color:var(--lm-terracotta-deep);border-color:var(--lm-terracotta)}
  .tag.milestone{background:#FDF3DE;color:#8A5E10}
  .tag.funny{background:#E7F0FA;color:var(--lm-slate)}
  .tag.growth{background:#E4F1E8;color:var(--lm-sage)}
  .save{width:100%;margin-top:20px;background:var(--lm-terracotta);color:#fff;border:none;border-radius:999px;padding:16px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(193,80,42,.35)}
</style>
</head>
<body>
<p class="caption">Add-memory sheet / photo upload &middot; revision-2 vivid palette</p>
<div class="device">
  <div class="screen">
    <div class="bg-hint">— Today screen behind sheet —</div>
    <div class="dim"></div>
    <div class="sheet">
      <div class="grabber"></div>
      <h1>Add a moment</h1>

      <label>Photo (optional)</label>
      <div class="photogrid">
        <div class="ptile p1">📷</div>
        <div class="ptile p2">📷</div>
        <div class="ptile p3">📷</div>
        <div class="ptile add">＋</div>
      </div>
      <div class="privacy">🔒 Photos stay private to your family. Never public, never used for AI, never scanned for faces.</div>

      <label for="title">Title</label>
      <input id="title" type="text" placeholder="First belly laugh? A food that got everywhere?">

      <label>What kind of moment? (optional)</label>
      <div class="tags">
        <span class="tag first">First time</span>
        <span class="tag milestone">Milestone-ish ★</span>
        <span class="tag funny">Funny</span>
        <span class="tag growth">Growing up</span>
      </div>

      <label for="date">Date</label>
      <input id="date" type="text" value="Today, July 10">

      <button class="save">Add to Maya's journey</button>
    </div>
  </div>
</div>
</body>
</html>
